% Evaluate Depth-First on 3.5D Topology with uniform random traffic and 50% of
% VLs removed between the IODs and the upper chiplets

[topology]
   MULTI_MESH
[/topology]

[routing]
   DEPTH_FIRST
[/routing]

[pir]
   0.001 0.0070 0.0005 poisson
[/pir]

[default]
   -sim 100000
   -warmup 2000
   -size 8 8
   -buffer 4
   -config ./depth_first_3/3D5Baseline50VLRedIODCPUDACCD.yaml
   -power ../bin/power.yaml
   -traffic random
[/default]

[aggregation]
   pir
[/aggregation]

[explorer]
   simulator ../bin/noxim
   repetitions 5
[/explorer]

