% Evaluate VDA on 2.5D Topology with local traffic

[topology]
   MULTI_MESH
[/topology]

[routing]
   VDA
[/routing]

[pir]
   0.001 0.018 0.0005 poisson
[/pir]

[default]
   -sim 100000
   -warmup 2000
   -size 8 8
   -buffer 4
   -config ../config_examples/2D5MultiMeshBaseline.yaml
   -power ../bin/power.yaml
   -traffic local_chiplet 0.5
[/default]

[aggregation]
   pir
[/aggregation]

[explorer]
   simulator ../bin/noxim
   repetitions 5
[/explorer]
