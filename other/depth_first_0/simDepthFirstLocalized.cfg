% Evaluate Depth-First on 2.5D Topology (1 VC Interp.) with local traffic

[topology]
   MULTI_MESH
[/topology]

[routing]
   DEPTH_FIRST
[/routing]

[pir]
   0.001 0.014 0.0005 poisson
[/pir]

[default]
   -sim 100000
   -warmup 2000
   -size 8 8
   -buffer 4
   -config ../config_examples/2D5MultiMeshBaselineI1VC.yaml
   -power ../bin/power.yaml
   -traffic local_chiplet 0.5
[/default]

[aggregation]
   pir
[/aggregation]

[explorer]
   simulator ../bin/noxim
   repetitions 5
[/explorer]
