% Evaluate Depth-First on 3.5D Topology with 75% of traffic being local to
% each chiplet

[topology]
   MULTI_MESH
[/topology]

[routing]
   DEPTH_FIRST
[/routing]

[pir]
   0.001 0.02 0.0005 poisson
[/pir]

[default]
   -sim 100000
   -warmup 2000
   -size 8 8
   -buffer 4
   -config ../config_examples/3D5MultiMeshBaseline.yaml
   -power ../bin/power.yaml
   -traffic local_chiplet 0.75
[/default]

[aggregation]
   pir
[/aggregation]

[explorer]
   simulator ../bin/noxim
   repetitions 5
[/explorer]

