% Evaluate Depth-First on 3.5D Topology with 50% local traffic (intra-chiplet)
% and 2 more IODs (+ 4 ACCDs), compared with baseline

[topology]
   MULTI_MESH
[/topology]

[routing]
   DEPTH_FIRST
[/routing]

[pir]
   0.001 0.008 0.0005 poisson
[/pir]

[default]
   -sim 100000
   -warmup 2000
   -size 8 8
   -buffer 4
   -config ./depth_first_4/3D5Baseline_5C.yaml
   -power ../bin/power.yaml
   -traffic local_chiplet 0.50
[/default]

[aggregation]
   pir
[/aggregation]

[explorer]
   simulator ../bin/noxim
   repetitions 5
[/explorer]

